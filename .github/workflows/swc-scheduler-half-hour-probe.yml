permissions: {}
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record configured slot and runner time
        env:
          TRIGGER_CRON: ${{ github.event.schedule }}
        run: |
          printenv TRIGGER_CRON
          TZ=America/Chicago date --iso-8601=seconds
          date -u --iso-8601=seconds
