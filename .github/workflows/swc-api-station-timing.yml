name: SWC API bounded station timing (read only)
on:
  push:
    branches: [feature/kashyyyk-parity-readonly]
    paths: ['.github/workflows/swc-api-station-timing.yml', 'tools/api-parity/full-station-audit.ts']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: swc-api-shadow-station-timing
  cancel-in-progress: false
jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: swc-api-shadow
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kashyyyk-parity-readonly
      - uses: actions/checkout@v4
        with:
          repository: toddaggie95/swc-personal-analytics
          ref: e5e09317db242662b7fb77aa8b46bbe637e070ae
          path: api-collector
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Initialize private credentials
        env:
          SWC_OAUTH_TOKENS_JSON: ${{ secrets.SWC_OAUTH_TOKENS_JSON }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/swc-private
          printf '%s' "$SWC_OAUTH_TOKENS_JSON" > /tmp/swc-private/tokens.json
      - name: Compare two concurrent 50-station workers on one GitHub runner
        working-directory: api-collector
        env:
          SWC_PRIVATE_DIR: /tmp/swc-private
          SWC_CLIENT_ID: ${{ secrets.SWC_CLIENT_ID }}
          SWC_CLIENT_SECRET: ${{ secrets.SWC_CLIENT_SECRET }}
          SWC_APP_ACTIVATED: 'true'
          SWC_SECRET_REGENERATED: 'true'
          SWC_SECRET_WRITER_TOKEN: ${{ secrets.SWC_SECRET_WRITER_TOKEN }}
          GH_TOKEN: ${{ secrets.SWC_SECRET_WRITER_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_SYSTEM: Kashyyyk
          TARGET_FACTION: tjo
          TARGET_OFFSET: '0'
          TARGET_LIMIT: '50'
          TARGET_PACING_EXPERIMENT: '1s'
        run: |
          set -euo pipefail
          # Only the coordinator may refresh/persist OAuth credentials.
          # Worker copies are short-lived and never become the durable source of truth.
          npm ci --ignore-scripts --no-audit --no-fund >/dev/null
          mkdir -p tools/api-parity
          cp ../tools/api-parity/full-station-audit.ts tools/api-parity/full-station-audit.ts
          echo 'Initializing OAuth credentials in one process before parallel reads'
          TARGET_OFFSET=175 TARGET_LIMIT=1 npx tsx tools/api-parity/full-station-audit.ts > /tmp/auth-prime.log 2>&1 || { cat /tmp/auth-prime.log; exit 1; }
          node --input-type=module -e 'import fs from "node:fs"; const t=JSON.parse(fs.readFileSync("/tmp/swc-private/tokens.json","utf8")); if (!t.refreshToken || t.expiresAt < Date.now()+600000) { console.error("::error::OAuth access token not valid for the full benchmark; refusing parallel refresh"); process.exit(1); }'
          bash ../tools/api-parity/persist-swc-token.sh
          cp /tmp/swc-private/tokens.json /tmp/swc-private/coordinator-tokens.json
          pids=()
          for offset in 0 50; do
            mkdir -p "/tmp/swc-private/worker-$offset"
            cp /tmp/swc-private/tokens.json "/tmp/swc-private/worker-$offset/tokens.json"
            ( SWC_PRIVATE_DIR="/tmp/swc-private/worker-$offset" TARGET_OFFSET="$offset" npx tsx tools/api-parity/full-station-audit.ts > "/tmp/worker-$offset.log" 2>&1 ) &
            pids+=("$!")
          done
          failed=0
          for pid in "${pids[@]}"; do wait "$pid" || failed=1; done
          for offset in 0 50; do
            if ! cmp -s /tmp/swc-private/coordinator-tokens.json "/tmp/swc-private/worker-$offset/tokens.json"; then
              echo "::error::Worker $offset independently refreshed OAuth; stop to avoid losing rotated credentials"
              failed=1
            fi
            echo "WORKER_OFFSET=$offset"
            grep -E 'AUDIT_SUMMARY|PACE_DIAGNOSTICS|Error|error' "/tmp/worker-$offset.log" || true
          done
          exit "$failed"
      - name: Upload sanitized timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: station-timing-Kashyyyk-tjo-single-runner-two-workers-${{ github.run_id }}
          path: /tmp/swc-audit-output/station-audit-*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Clean up private files
        if: always()
        run: rm -rf /tmp/swc-private
