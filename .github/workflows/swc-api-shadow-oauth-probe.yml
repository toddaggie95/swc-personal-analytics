name: SWC API Shadow - OAuth Probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swc-api-shadow-oauth
  cancel-in-progress: false

jobs:
  oauth-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: swc-api-shadow
    steps:
      - name: Checkout audited API implementation
        uses: actions/checkout@v4
        with:
          repository: toddaggie95/swc-personal-analytics
          ref: 233272c572516e09991c444258e46bceccbd156b
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated API test dependencies
        run: npm install --no-save --no-audit --no-fund dotenv@18.0.3 swcombine-sdk@3.5.0 tsx@4.23.15
      - name: Restore API source modules from pinned implementation
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin ea8241afadde47fd236bebdae9cb8b3b1aeef030
          git restore --source=FETCH_HEAD -- src/config src/auth src/storage src/swc src/models src/cli/secret-input.ts
      - name: Prepare private OAuth credentials
        shell: bash
        env:
          SWC_OAUTH_TOKENS_JSON: ${{ secrets.SWC_OAUTH_TOKENS_JSON }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/swc-private"
          if [ -z "$SWC_OAUTH_TOKENS_JSON" ]; then
            echo "::error::Missing OAuth token secret"
            exit 1
          fi
          printf '%s' "$SWC_OAUTH_TOKENS_JSON" > "$RUNNER_TEMP/swc-private/tokens.json"
      - name: One-request read-only OAuth probe
        env:
          SWC_CLIENT_ID: ${{ secrets.SWC_CLIENT_ID }}
          SWC_CLIENT_SECRET: ${{ secrets.SWC_CLIENT_SECRET }}
          SWC_PRIVATE_DIR: ${{ runner.temp }}/swc-private
          SWC_APP_ACTIVATED: 'true'
          SWC_SECRET_REGENERATED: 'true'
        run: npx tsx src/cli/github-auth-probe.ts
      - name: Remove temporary credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/swc-private"
