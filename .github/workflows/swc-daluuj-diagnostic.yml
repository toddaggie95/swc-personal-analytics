name: SWC API Station Diagnostics
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Single station or bounded full-system batch'
        type: choice
        required: true
        default: station
        options: [station, audit-batch]
      faction:
        description: 'Faction for audit batch'
        type: choice
        required: true
        default: tjo
        options: [tjo, tff]
      offset:
        description: 'Zero-based starting station index for audit batch'
        type: number
        required: true
        default: 0
      limit:
        description: 'Number of station details to read (maximum 50)'
        type: number
        required: true
        default: 25
      system:
        description: 'SWC system name'
        required: true
        type: string
        default: Kashyyyk
      station_uid:
        description: 'Station UID (5:xxxxx)'
        required: true
        type: string
        default: '5:56984'
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: swc-api-shadow
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kashyyyk-parity-readonly
      - uses: actions/checkout@v4
        with:
          repository: toddaggie95/swc-personal-analytics
          ref: e5e09317db242662b7fb77aa8b46bbe637e070ae
          path: api-collector
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Initialize private credentials
        env:
          SWC_OAUTH_TOKENS_JSON: ${{ secrets.SWC_OAUTH_TOKENS_JSON }}
        run: |
          umask 077
          mkdir -p /tmp/swc-private
          printf '%s' "$SWC_OAUTH_TOKENS_JSON" > /tmp/swc-private/tokens.json
      - name: Run targeted read-only station diagnostics
        working-directory: api-collector
        env:
          SWC_PRIVATE_DIR: /tmp/swc-private
          SWC_CLIENT_ID: ${{ secrets.SWC_CLIENT_ID }}
          SWC_CLIENT_SECRET: ${{ secrets.SWC_CLIENT_SECRET }}
          SWC_APP_ACTIVATED: 'true'
          SWC_SECRET_REGENERATED: 'true'
          SWC_SECRET_WRITER_TOKEN: ${{ secrets.SWC_SECRET_WRITER_TOKEN }}
          GH_TOKEN: ${{ secrets.SWC_SECRET_WRITER_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_SYSTEM: ${{ inputs.system }}
          TARGET_STATION_UID: ${{ inputs.station_uid }}
          TARGET_FACTION: ${{ inputs.faction }}
          TARGET_OFFSET: ${{ inputs.offset }}
          TARGET_LIMIT: ${{ inputs.limit }}
          TARGET_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          trap 'status=$?; if [ -s /tmp/swc-private/tokens.json ]; then gh secret set SWC_OAUTH_TOKENS_JSON --repo "$GITHUB_REPOSITORY" --env swc-api-shadow < /tmp/swc-private/tokens.json || echo "::error::OAuth rotation persistence failed"; fi; exit "$status"' EXIT
          npm ci --ignore-scripts --no-audit --no-fund >/dev/null
          mkdir -p tools/api-parity
          cp ../tools/api-parity/benchmark-targeted.ts tools/api-parity/benchmark-targeted.ts
          cp ../tools/api-parity/full-station-audit.ts tools/api-parity/full-station-audit.ts
          if [ "$TARGET_MODE" = 'audit-batch' ]; then
            npx tsx tools/api-parity/full-station-audit.ts
          else
            npx tsx tools/api-parity/benchmark-targeted.ts
          fi
      - name: Upload sanitized station audit report
        if: always() && inputs.mode == 'audit-batch'
        uses: actions/upload-artifact@v4
        with:
          name: station-audit-${{ inputs.system }}-${{ inputs.faction }}-${{ inputs.offset }}-${{ github.run_id }}
          path: /tmp/swc-audit-output/station-audit.json
          if-no-files-found: warn
          retention-days: 30
      - name: Clean up private files
        if: always()
        run: rm -rf /tmp/swc-private
