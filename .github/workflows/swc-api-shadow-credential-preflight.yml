name: SWC API Shadow - Credential Preflight

# Safe first gate: checks secret availability only. No OAuth exchange, API calls,
# refresh, credential output, inventory export, or production side effects.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swc-api-shadow-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: swc-api-shadow
    steps:
      - name: Check configured secret presence (never print values)
        env:
          SWC_CLIENT_ID: ${{ secrets.SWC_CLIENT_ID }}
          SWC_CLIENT_SECRET: ${{ secrets.SWC_CLIENT_SECRET }}
          SWC_OAUTH_TOKENS_JSON: ${{ secrets.SWC_OAUTH_TOKENS_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in SWC_CLIENT_ID SWC_CLIENT_SECRET SWC_OAUTH_TOKENS_JSON; do
            if [ -z "${!key:-}" ]; then
              echo "::error title=Missing configuration::Set $key in the swc-api-shadow environment secrets."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo 'All required secret names are configured. No secret contents inspected or printed.'
      - name: Explain next gate
        if: success()
        run: |
          echo '## Credential preflight succeeded' >> "$GITHUB_STEP_SUMMARY"
          echo 'This check does not authenticate or contact SWC. A separately reviewed, bounded API probe is the next step.' >> "$GITHUB_STEP_SUMMARY"
