name: SWC API Shadow - Credential Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swc-api-shadow-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: swc-api-shadow
    steps:
      - name: Check secret presence without revealing values
        env:
          SWC_CLIENT_ID: ${{ secrets.SWC_CLIENT_ID }}
          SWC_CLIENT_SECRET: ${{ secrets.SWC_CLIENT_SECRET }}
          SWC_OAUTH_TOKENS_JSON: ${{ secrets.SWC_OAUTH_TOKENS_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in SWC_CLIENT_ID SWC_CLIENT_SECRET SWC_OAUTH_TOKENS_JSON; do
            if [ -z "${!key:-}" ]; then
              echo "::error title=Missing configuration::Set $key in the swc-api-shadow environment secrets."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo 'Required secrets are configured. No secret values inspected or printed.'
      - name: Summarize
        if: success()
        run: |
          echo '## Credential preflight succeeded' >> "$GITHUB_STEP_SUMMARY"
          echo 'No OAuth exchange, SWC API calls, token refresh, inventory export, or production writes occurred.' >> "$GITHUB_STEP_SUMMARY"
