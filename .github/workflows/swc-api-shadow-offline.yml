name: SWC API Shadow - Offline Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/swc-api-shadow-offline.yml'

permissions:
  contents: read

concurrency:
  group: swc-api-shadow-offline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated API branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Typecheck, tests, and build
        run: npm run check
      - name: Publish safe validation summary
        if: always()
        run: |
          {
            echo '## SWC API Shadow Offline Validation'
            echo 'No SWC credentials were loaded, no live SWC requests were made, and no production workflow was invoked.'
            echo 'This workflow only typechecks, tests, and builds the API client.'
          } >> "$GITHUB_STEP_SUMMARY"
