name: SWC API parity tests (read only)
on:
  pull_request:
    paths:
      - 'tools/api-parity/**'
      - 'tools/production-sync/audited-inventory.mjs'
      - 'tools/production-sync/production-sync.mjs'
      - '.github/workflows/swc-api-parity-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test production HAS adapter
        run: node --test tools/api-parity/compare-production-has.test.mjs
      - name: Test CSV/API comparator
        run: python -m unittest discover -s tools/api-parity -p 'test_*.py' -v
