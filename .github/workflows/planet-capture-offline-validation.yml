name: Validate saved planetary snapshot
on:
  push:
    branches: [feature/planet-snapshot-capture]
permissions:
  contents: read
  actions: read
concurrency:
  group: swc-api-shadow-oauth
  cancel-in-progress: false
jobs:
  replay:
    if: github.event.head_commit.message == 'Validate saved snapshot and inspect three redacted references'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: swc-api-shadow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore existing encrypted capture without API reads
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 43801509178 --repo "$GITHUB_REPOSITORY" --pattern 'planet-capture-*-encrypted' --dir "$RUNNER_TEMP/evidence"
      - name: Reproduce snapshot with basic references retained as unknowns
        env:
          SWC_API_SNAPSHOT_PRIVATE_KEY: ${{ secrets.SWC_API_SNAPSHOT_PRIVATE_KEY }}
        run: node tools/planet-api/assemble-planet-capture.mjs "$RUNNER_TEMP/evidence/planet-capture-plan-encrypted" "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/snapshot"
      - uses: actions/upload-artifact@v4
        with:
          name: reproduced-planet-snapshot-encrypted
          path: ${{ runner.temp }}/snapshot/*.encrypted.json
          retention-days: 90
          if-no-files-found: error
  field_probe:
    if: github.event.head_commit.message == 'Validate saved snapshot and inspect three redacted references'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: swc-api-shadow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore existing city evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 43801509178 --repo "$GITHUB_REPOSITORY" --pattern 'planet-capture-cities-*-encrypted' --dir "$RUNNER_TEMP/cities"
      - name: Inspect only three basic facility references without refresh
        env:
          SWC_CAPTURE_SAVED_CITIES: ${{ runner.temp }}/cities
          SWC_OAUTH_TOKENS_JSON: ${{ secrets.SWC_OAUTH_TOKENS_JSON }}
          SWC_API_SNAPSHOT_PRIVATE_KEY: ${{ secrets.SWC_API_SNAPSHOT_PRIVATE_KEY }}
        run: node tools/planet-api/probe-basic-references.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: basic-reference-probe-encrypted
          path: ${{ runner.temp }}/basic-reference-probe/*.encrypted.json
          retention-days: 90
          if-no-files-found: warn
