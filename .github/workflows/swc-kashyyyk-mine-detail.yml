name: SWC API - Kashyyyk Mine Detail
on:
  workflow_dispatch:
    inputs:
      mine_uid:
        description: 'Kashyyyk mine UID (format 4:1234567)'
        required: true
        type: string
      compare_mine_uid:
        description: Optional running mine UID for a full API field comparison
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: swc-api-shadow-oauth
  cancel-in-progress: false
jobs:
  read-mine:
    runs-on: ubuntu-latest
    environment: swc-api-shadow
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Stage the existing SWC credential privately
        if: inputs.compare_mine_uid != ''
        id: credential
        env:
          SWC_OAUTH_TOKENS_JSON: ${{ secrets.SWC_OAUTH_TOKENS_JSON }}
        run: |
          umask 077
          mkdir "$RUNNER_TEMP/swc-mine-private"
          node --input-type=module <<'NODE'
          import {appendFileSync, writeFileSync} from 'node:fs';
          const saved = JSON.parse(process.env.SWC_OAUTH_TOKENS_JSON || '{}');
          if (!saved.accessToken || !Number.isFinite(saved.expiresAt)) throw Error('SWC credential unavailable.');
          writeFileSync(process.env.RUNNER_TEMP + '/swc-mine-private/tokens.json', JSON.stringify(saved));
          appendFileSync(process.env.GITHUB_OUTPUT, 'refresh=' + (saved.expiresAt < Date.now() + 5 * 60_000) + '\n');
          NODE
      - uses: actions/checkout@v4
        if: steps.credential.outputs.refresh == 'true'
        with:
          ref: e5e09317db242662b7fb77aa8b46bbe637e070ae
          path: collector
          persist-credentials: false
      - name: Refresh using the shared durable OAuth coordinator
        if: steps.credential.outputs.refresh == 'true'
        working-directory: collector
        env:
          SWC_PRIVATE_DIR: ${{ runner.temp }}/swc-mine-private
          SWC_CLIENT_ID: ${{ secrets.SWC_CLIENT_ID }}
          SWC_CLIENT_SECRET: ${{ secrets.SWC_CLIENT_SECRET }}
          SWC_SECRET_WRITER_TOKEN: ${{ secrets.SWC_SECRET_WRITER_TOKEN }}
          SWC_APP_ACTIVATED: 'true'
          SWC_SECRET_REGENERATED: 'true'
          SWC_FORCE_REFRESH: 'true'
        run: |
          set -euo pipefail
          cp ../src/auth/*.ts src/auth/
          cp ../src/cli/github-auth-probe.ts src/cli/
          npm ci --ignore-scripts --no-audit --no-fund >/dev/null
          npx --no-install tsx src/cli/github-auth-probe.ts
      - name: Compare the two mine details
        if: inputs.compare_mine_uid != ''
        run: |
          set -eo pipefail
          node tools/mine-restart/compare-mine-fields.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: inputs.compare_mine_uid != ''
        with:
          name: mine-field-comparison-encrypted
          path: ${{ runner.temp }}/mine-field-comparison.encrypted.json
          retention-days: 7
          if-no-files-found: error
      - name: Read one facility with the existing SWC credential
        if: inputs.compare_mine_uid == ''
        env:
          SWC_OAUTH_TOKENS_JSON: ${{ secrets.SWC_OAUTH_TOKENS_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/mine-detail.json"
          trap 'rm -f -- "$out"' EXIT
          node --input-type=module - "$out" <<'NODE'
          import {readFileSync} from 'node:fs';
          const uid = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8')).inputs?.mine_uid?.trim();
          if (!/^4:\d+$/.test(uid ?? '')) {
            console.error('Enter a facility UID in the form 4:1234567.');
            process.exit(1);
          }
          console.log(`::add-mask::${uid}`);
          process.argv.splice(2, 0, uid);
          try {
            const saved = JSON.parse(process.env.SWC_OAUTH_TOKENS_JSON);
            if (typeof saved.accessToken !== 'string' || !saved.accessToken.trim() ||
                !Number.isFinite(saved.expiresAt) || saved.expiresAt < Date.now() + 120000) {
              throw Error();
            }
            process.env.SWC_ACCESS_TOKEN = saved.accessToken;
          } catch {
            console.error('Existing SWC credential is missing or near expiry. Run the shared OAuth coordinator first.');
            process.exit(1);
          }
          delete process.env.SWC_OAUTH_TOKENS_JSON;
          await import('./tools/mine-restart/read-facility.mjs');
          NODE
          node --input-type=module - "$out" <<'NODE' | tee -a "$GITHUB_STEP_SUMMARY"
          import {readFileSync} from 'node:fs';
          const {entity} = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          console.log('Verified one Kashyyyk mine via SWC facility detail GET.');
          const fields = Object.keys(entity).filter(key => /^(action|deposit|mining|cargo|capacity|infotext|tags)/i.test(key));
          console.log('Relevant top-level fields present: ' + (fields.join(', ') || 'none'));
          function describe(value, path, depth = 0) {
            const kind = value === null ? 'null' : Array.isArray(value) ? 'array' : typeof value;
            console.log(`${path}: ${kind}`);
            if (depth >= 5) return;
            if (kind === 'array') {
              if (value.length) describe(value[0], path + '[]', depth + 1);
            } else if (kind === 'object') {
              for (const [key, child] of Object.entries(value).slice(0, 24)) {
                if (/^[a-z][a-z_-]{0,50}$/i.test(key)) describe(child, path + '.' + key, depth + 1);
              }
            }
          }
          for (const key of ['infotext', 'tags', 'actions', 'cargo', 'deposits']) {
            if (Object.hasOwn(entity, key)) describe(entity[key], key);
          }
          const norm = value => typeof value === 'string' ? value.trim().toLowerCase() : '';
          const positive = value => Number.isSafeInteger(value) && value > 0;
          const actions = entity.actions?.action;
          const action = Array.isArray(actions) && actions.length === 1 ? actions[0] : null;
          const status = norm(action?.value?.status);
          const pausedMining = Boolean(action && [action.attributes?.type, action.value?.actiontype]
            .some(value => ['mine', 'mining'].includes(norm(value))) &&
            ['paused', 'mining paused'].includes(status) && positive(action.attributes?.id));
          const yieldUnits = action?.value?.['expected-yield'];
          const deposits = entity.deposits?.deposit;
          const deposit = Array.isArray(deposits) && deposits.length === 1 ? deposits[0] : null;
          const meleenium = norm(deposit?.value) === 'meleenium';
          const remaining = deposit?.attributes?.quantity;
          const volume = entity.cargo?.volumecapacity;
          // SWC mining rules list Meleenium at 1 m³ per unit.
          const enoughMineVolume = meleenium && positive(yieldUnits) && Number.isFinite(volume?.remaining) &&
            Number.isFinite(volume?.total) && volume.remaining <= volume.total && volume.remaining >= yieldUnits;
          const checks = {
            'Single identifiable paused mining action': pausedMining,
            'Meleenium deposit covers one expected cycle': meleenium && positive(remaining) &&
              positive(yieldUnits) && remaining >= yieldUnits,
            'Mine cargo volume covers one Meleenium cycle': enoughMineVolume,
            'Facility powered, complete and intact': norm(entity.ispowered) === 'yes' &&
              norm(entity.underconstruction) === 'no' && norm(entity.wrecked) === 'no',
            'Inventory infotext and tags verified empty': typeof entity.infotext === 'string' &&
              !entity.infotext.trim() && Array.isArray(entity.tags?.tag) && entity.tags.tag.length === 0,
          };
          for (const [label, pass] of Object.entries(checks)) {
            console.log(label + ': ' + (pass ? 'PASS' : 'REVIEW'));
          }
          console.log('API evidence checks: ' + (Object.values(checks).every(Boolean) ? 'PASS' : 'REVIEW'));
          console.log('Restart approval and any external restrictions require separate confirmation.');
          NODE
      - name: Remove temporary OAuth data
        if: always() && inputs.compare_mine_uid != ''
        run: rm -rf -- "$RUNNER_TEMP/swc-mine-private"
