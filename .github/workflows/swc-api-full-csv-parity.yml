name: SWC full station CSV/API parity (read only)
# Diagnostic rerun: record API anomalies without suppressing remaining UID comparisons.
on:
  push:
    branches: [feature/kashyyyk-parity-readonly]
    paths: ['.github/workflows/swc-api-full-csv-parity.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate Google Drive (read-only use)
        id: google
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/772242617730/locations/global/workloadIdentityPools/github-actions/providers/github'
          service_account: 'swc-production-sync@swc-analytics-512519.iam.gserviceaccount.com'
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
      - name: Download current accepted CSV exports
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          SWC_EXPORT_FOLDER_ID: '1oGgiWgYZzPvfk6Kcjp_jeAY55eIREY28'
          SWC_EXPORT_OUTPUT: /tmp/swc-csv
        run: python3 tools/production-sync/download-drive-exports.py
      - name: Download complete prior API collection
        uses: actions/download-artifact@v4
        with:
          run-id: 42162627899
          github-token: ${{ github.token }}
          pattern: station-batch-*
          path: /tmp/swc-api
      - name: Audit 100 percent of station UIDs and recorded comparable fields
        run: python3 tools/api-parity/audit-full-station-csv.py /tmp/swc-csv /tmp/swc-api /tmp/swc-parity/full-station-parity.json
      - name: Summarize API anomalies by station and reason
        run: |
          python3 - <<'PY'
          import json,collections
          p=json.load(open('/tmp/swc-parity/full-station-parity.json'))
          anomalies=p['apiAnomalies']
          print('ANOMALY_BREAKDOWN',json.dumps(dict(collections.Counter(a for x in anomalies for a in x['anomalies']))))
          for x in anomalies: print('ANOMALY_STATION',json.dumps(x))
          PY
      - name: Upload detailed read-only report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-station-csv-parity-report
          path: /tmp/swc-parity/full-station-parity.json
          if-no-files-found: warn
          retention-days: 30
