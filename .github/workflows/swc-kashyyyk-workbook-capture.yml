name: SWC Kashyyyk workbook readiness capture (read only)
on:
  workflow_dispatch:
  push:
    branches:
      - feature/kashyyyk-parity-readonly
    paths:
      - '.github/workflows/swc-kashyyyk-workbook-capture.yml'
permissions:
  contents: read
  id-token: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate read-only Google source access
        id: google
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/772242617730/locations/global/workloadIdentityPools/github-actions/providers/github'
          service_account: 'swc-production-sync@swc-analytics-512519.iam.gserviceaccount.com'
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly,https://www.googleapis.com/auth/spreadsheets.readonly
      - name: Download current CSV exports (read only)
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          SWC_EXPORT_FOLDER_ID: '1oGgiWgYZzPvfk6Kcjp_jeAY55eIREY28'
          SWC_EXPORT_OUTPUT: ${{ runner.temp }}/swc-exports
        run: python3 tools/production-sync/download-drive-exports.py
      - name: Capture current workbook assignments and bills (read only)
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          SWC_PRODUCTION_SHEET_ID: '1ezzYU4MYW9VyWWR2mJWQ6jmFlZKxPxvezZAscXtx5q8'
        run: |
          python3 tools/production-sync/capture-overview-snapshot.py \
            tools/production-sync/audited-workbook-layout.json \
            tools/production-sync/audited-production-orders.json \
            "${{ runner.temp }}/overview-input.json"
      - name: Verify real workbook and CSV readiness calculator (read only)
        run: |
          node tools/production-sync/overview-cli.mjs \
            --snapshot "${{ runner.temp }}/overview-input.json" \
            --tff-stations "${{ runner.temp }}/swc-exports/tff-stations.csv" \
            --tjo-stations "${{ runner.temp }}/swc-exports/tjo-stations.csv" \
            --tff-materials "${{ runner.temp }}/swc-exports/tff-materials.csv" \
            --tjo-materials "${{ runner.temp }}/swc-exports/tjo-materials.csv" \
            --out "${{ runner.temp }}/overview-readiness.json"
      - name: Upload captured read-only workbook and readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swc-kashyyyk-workbook-capture
          path: |
            ${{ runner.temp }}/overview-input.json
            ${{ runner.temp }}/overview-readiness.json
            ${{ runner.temp }}/swc-exports/export-manifest.json
          if-no-files-found: warn
          retention-days: 7
