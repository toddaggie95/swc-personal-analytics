name: SWC API Shadow - Inventory and Calculated Output Parity
on:
  push:
    branches: [feature/kashyyyk-parity-readonly]
    paths: ['.github/workflows/swc-api-shadow-chamble-parity.yml']
  workflow_dispatch:
    inputs:
      scope:
        description: 'Inventory collection scope (push beta runs all; dispatch can target one)'
        type: choice
        options: [targeted, all]
        required: true
        default: targeted
permissions:
  contents: read
  id-token: write
concurrency:
  group: swc-all-systems-live-parity
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: swc-api-shadow
    env:
      SWC_CLIENT_ID: ${{ secrets.SWC_CLIENT_ID }}
      SWC_CLIENT_SECRET: ${{ secrets.SWC_CLIENT_SECRET }}
      SWC_APP_ACTIVATED: 'true'
      SWC_SECRET_REGENERATED: 'true'
      SWC_PRIVATE_DIR: /tmp/swc-private
      SWC_PARITY_SCOPE: ${{ github.event_name == 'push' && 'all' || inputs.scope || 'targeted' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: parity
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: toddaggie95/swc-personal-analytics
          ref: e5e09317db242662b7fb77aa8b46bbe637e070ae
          path: collector
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate renewable OAuth credentials and durable secret writer
        env:
          SWC_OAUTH_TOKENS_JSON: ${{ secrets.SWC_OAUTH_TOKENS_JSON }}
          SWC_SECRET_WRITER_TOKEN: ${{ secrets.SWC_SECRET_WRITER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$SWC_PRIVATE_DIR"
          printf '%s' "$SWC_OAUTH_TOKENS_JSON" > "$SWC_PRIVATE_DIR/tokens.json"
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const t=JSON.parse(readFileSync(process.env.SWC_PRIVATE_DIR+"/tokens.json","utf8"));
            if(typeof t.accessToken!=="string" || !Number.isFinite(t.expiresAt) || typeof t.refreshToken!=="string" || !t.refreshToken) {
              console.error("SWC OAuth credentials missing or cannot refresh. No live calls attempted.");
              process.exit(1);
            }
          '
          if [[ -z "${SWC_SECRET_WRITER_TOKEN:-}" ]]; then
            echo "Configure SWC_SECRET_WRITER_TOKEN in the swc-api-shadow environment with permission to update environment secrets; refusing rotating refresh without durable storage." >&2
            exit 1
          fi
      - name: Install and test scoped collector
        working-directory: collector
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run typecheck && npm test
      - name: Read current four CSV exports without modifying Drive
        id: google
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/772242617730/locations/global/workloadIdentityPools/github-actions/providers/github'
          service_account: 'swc-production-sync@swc-analytics-512519.iam.gserviceaccount.com'
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly,https://www.googleapis.com/auth/spreadsheets.readonly
      - name: Download verified CSV baseline
        working-directory: parity
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          SWC_EXPORT_FOLDER_ID: '1oGgiWgYZzPvfk6Kcjp_jeAY55eIREY28'
          SWC_EXPORT_OUTPUT: /tmp/swc-parity-csv
        run: |
          if ! python3 tools/production-sync/download-drive-exports.py > /tmp/swc-csv-download.log 2>&1; then
            python3 - <<'PY'
          import pathlib, re
          log=pathlib.Path("/tmp/swc-csv-download.log").read_text(errors="replace")
          for line in log.splitlines():
              if "Export discovery failed:" in line:
                  line=re.sub(r"Drive ID [A-Za-z0-9_-]+", "Drive ID [redacted]", line)
                  line=re.sub(r"accepted export content changed: [A-Za-z0-9_-]+", "accepted export content changed: [redacted]", line)
                  print(line)
          PY
            exit 1
          fi
      - name: Compare refreshed exports to live API and persist token rotation
        id: inventory
        working-directory: collector
        shell: bash
        env:
          SWC_SECRET_WRITER_TOKEN: ${{ secrets.SWC_SECRET_WRITER_TOKEN }}
        run: |
          set -euo pipefail
          persist() {
            bash ../parity/tools/api-parity/persist-swc-token.sh
          }
          trap persist EXIT
          set +e
          bash ../parity/tools/api-parity/run-all-systems.sh > /tmp/swc-inventory-summary.log 2>&1
          set -e
          grep -E '^RESULT |^SUMMARY ' /tmp/swc-inventory-summary.log || true
          python3 -c "import os,re,pathlib,sys; log=pathlib.Path('/tmp/swc-inventory-summary.log').read_text(); results=re.findall(r'^RESULT (.+) (PASS|DISCREPANCY|COLLECTION_ERROR)',log,re.M); expected=20 if os.environ.get('SWC_PARITY_SCOPE')=='all' else 1; errors=sum(status=='COLLECTION_ERROR' for _,status in results); discrepancies=sum(status=='DISCREPANCY' for _,status in results); print('Inventory coverage',len(results),'/',expected,'collection errors',errors,'discrepant systems',discrepancies); open(os.environ['GITHUB_OUTPUT'],'a').write('discrepant_systems='+str(discrepancies)+'\\n'); sys.exit(1 if len(results)!=expected or errors else 0)"
      - name: Capture one immutable read-only workbook input
        if: success() && env.SWC_PARITY_SCOPE == 'all'
        working-directory: parity
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          SWC_PRODUCTION_SHEET_ID: '1ezzYU4MYW9VyWWR2mJWQ6jmFlZKxPxvezZAscXtx5q8'
        run: |
          python3 tools/production-sync/capture-overview-snapshot.py \
            tools/production-sync/audited-workbook-layout.json \
            tools/production-sync/audited-production-orders.json \
            /tmp/swc-private/workbook.json
      - name: Compare all production HAS and readiness calculations (no writes)
        if: success() && env.SWC_PARITY_SCOPE == 'all'
        working-directory: parity
        run: |
          set -euo pipefail
          set +e
          node tools/api-parity/compare-production-has.mjs \
            --manifest tools/production-sync/audited-workbook-layout.json \
            --web-dir /tmp/swc-parity-csv \
            --api-dir /tmp/swc-private/normalized \
            --system all \
            --out /tmp/swc-private/production-has-parity.json
          has_exit=$?
          node tools/api-parity/run-readiness-parity.mjs \
            --snapshot /tmp/swc-private/workbook.json \
            --web-dir /tmp/swc-parity-csv \
            --api-dir /tmp/swc-private/normalized \
            --system all \
            --out /tmp/swc-private/readiness-parity.json
          readiness_exit=$?
          echo "Calculated parity exit codes: HAS=$has_exit readiness=$readiness_exit"
          [[ "$has_exit" -eq 0 && "$readiness_exit" -eq 0 ]]
      - name: Enforce inventory parity separately after calculated comparisons
        if: always() && steps.inventory.outcome == 'success'
        env:
          DISCREPANT_SYSTEMS: ${{ steps.inventory.outputs.discrepant_systems }}
        run: |
          echo "Inventory-discrepant systems: $DISCREPANT_SYSTEMS"
          [[ "$DISCREPANT_SYSTEMS" == '0' ]]
      # Repository is public: keep UID-level comparison data off public artifacts.
      - name: Remove private snapshots and credentials
        if: always()
        run: rm -rf /tmp/swc-private /tmp/swc-parity-csv /tmp/swc-parity-*.json /tmp/swc-*.log
