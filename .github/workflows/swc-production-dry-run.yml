name: SWC Production Sync

on:
  push:
    branches: [feature/production-api-source-integration]
    paths: ['.github/workflows/swc-production-dry-run.yml']
  workflow_dispatch:
    inputs:
      export_source:
        description: 'Input source: API or Manual Export (CSV)'
        type: choice
        options: [api, csv]
        required: true
        default: api
      enable_has_writes:
        description: 'Write validated HAS changes to Google Sheets (default: true)'
        type: boolean
        required: true
        default: true
      force_republish:
        description: 'Development override: reapply HAS and downstream reports for existing exports'
        type: boolean
        required: true
        default: false
      trash_superseded_exports:
        description: 'Mark older exports trash_ and rename accepted files (default: true)'
        type: boolean
        required: true
        default: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: swc-api-shadow-oauth
  cancel-in-progress: false

jobs:
  dry-run:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Validate API and Manual Export production previews without writes'
    environment: swc-api-shadow
    strategy:
      fail-fast: false
      matrix:
        source: ${{ github.event_name == 'push' && fromJSON('["api","csv"]') || fromJSON(format('["{0}"]', inputs.export_source || 'api')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out audited branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Authenticate Google Drive and Sheets
        id: google
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/772242617730/locations/global/workloadIdentityPools/github-actions/providers/github'
          service_account: 'swc-production-sync@swc-analytics-512519.iam.gserviceaccount.com'
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive,https://www.googleapis.com/auth/spreadsheets

      - name: Check out pinned API collector
        if: matrix.source == 'api'
        uses: actions/checkout@v4
        with:
          repository: toddaggie95/swc-personal-analytics
          ref: e5e09317db242662b7fb77aa8b46bbe637e070ae
          path: api-collector
          persist-credentials: false
      - name: Prepare durable API collector
        if: matrix.source == 'api'
        env:
          SWC_OAUTH_TOKENS_JSON: ${{ secrets.SWC_OAUTH_TOKENS_JSON }}
          SWC_SECRET_WRITER_TOKEN: ${{ secrets.SWC_SECRET_WRITER_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/swc-private api-collector/tools/api-parity
          test -n "$SWC_SECRET_WRITER_TOKEN"
          printf '%s' "$SWC_OAUTH_TOKENS_JSON" > /tmp/swc-private/tokens.json
          cp /tmp/swc-private/tokens.json /tmp/swc-private/initial-tokens.json
          cp src/auth/*.ts api-collector/src/auth/
          cp tools/api-parity/collect-production-inputs.ts tools/api-parity/production-contract.mjs api-collector/tools/api-parity/
      - name: Prepare encrypted accepted API handoff
        if: matrix.source == 'api' && github.event_name == 'workflow_dispatch' && inputs.enable_has_writes == true
        env:
          SWC_API_SNAPSHOT_PRIVATE_KEY: ${{ secrets.SWC_API_SNAPSHOT_PRIVATE_KEY }}
          SWC_SECRET_WRITER_TOKEN: ${{ secrets.SWC_SECRET_WRITER_TOKEN }}
        run: node tools/api-parity/api-snapshot.mjs prepare-key /tmp/swc-private/accepted-public-key.pem
      - name: Collect complete API production inputs
        if: matrix.source == 'api'
        working-directory: api-collector
        env:
          SWC_PRIVATE_DIR: /tmp/swc-private
          SWC_SYSTEMS_FILE: ${{ github.workspace }}/tools/production-sync/systems.addresses.json
          SWC_CLIENT_ID: ${{ secrets.SWC_CLIENT_ID }}
          SWC_CLIENT_SECRET: ${{ secrets.SWC_CLIENT_SECRET }}
          SWC_SECRET_WRITER_TOKEN: ${{ secrets.SWC_SECRET_WRITER_TOKEN }}
          SWC_APP_ACTIVATED: 'true'
          SWC_SECRET_REGENERATED: 'true'
        run: |
          set -euo pipefail
          trap 'status=$?; bash ../tools/api-parity/persist-swc-token.sh || status=1; exit "$status"' EXIT
          npm ci --ignore-scripts --no-audit --no-fund >/dev/null
          npx tsx tools/api-parity/collect-production-inputs.ts
      - name: Convert API inventory into production inputs
        if: matrix.source == 'api'
        run: node tools/api-parity/export-canonical-csv.mjs /tmp/swc-private/normalized - "${{ runner.temp }}/swc-exports" tools/production-sync/systems.addresses.json

      - name: Download four exports from private Drive folder
        if: matrix.source == 'csv'
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          SWC_EXPORT_FOLDER_ID: '1oGgiWgYZzPvfk6Kcjp_jeAY55eIREY28'
          SWC_EXPORT_OUTPUT: ${{ runner.temp }}/swc-exports
        run: python3 tools/production-sync/download-drive-exports.py

      - name: Detect new verified export batch
        id: batch_gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/production-sync/check-new-batch.py "${{ runner.temp }}/swc-exports/export-manifest.json"

      - name: Test export auto-discovery
        run: python3 -m unittest discover -s tools/production-sync -p 'test_download_drive_exports.py' -v

      - name: Audit tooling and infotext (advisory only)
        working-directory: tools/production-sync
        run: |
          node tooling-infotext-audit.mjs \
            "${{ runner.temp }}/swc-exports/tff-stations.csv" \
            "${{ runner.temp }}/swc-exports/tjo-stations.csv" \
            "${{ runner.temp }}/tooling-infotext-report.json"

      - name: Run inventory unit tests
        working-directory: tools/production-sync
        run: node --test production-sync.test.mjs audited-inventory.test.mjs station-registry-audit.test.mjs system-has-audit.test.mjs

      - name: Calculate audited inventory (no spreadsheet writes)
        working-directory: tools/production-sync
        run: |
          node audited-inventory.mjs \
            --tff-materials "${{ runner.temp }}/swc-exports/tff-materials.csv" \
            --tjo-materials "${{ runner.temp }}/swc-exports/tjo-materials.csv" \
            --tff-stations "${{ runner.temp }}/swc-exports/tff-stations.csv" \
            --tjo-stations "${{ runner.temp }}/swc-exports/tjo-stations.csv" \
            --manifest audited-workbook-layout.json \
            --out "${{ runner.temp }}/audited-ledger.json"

      - name: Audit complete station registry and untracked TJO shipyards (read only)
        working-directory: tools/production-sync
        run: |
          BASELINE="station-registry-baseline.json"
          if [ ! -f "$BASELINE" ]; then BASELINE="-"; fi
          node station-registry-audit.mjs \
            "${{ runner.temp }}/swc-exports/tff-stations.csv" \
            "${{ runner.temp }}/swc-exports/tjo-stations.csv" \
            audited-workbook-layout.json \
            "$BASELINE" \
            "${{ runner.temp }}/station-registry-audit.json" \
            "${{ runner.temp }}/station-registry-bootstrap.json"

      - name: Calculate complete system orbital HAS (read only)
        working-directory: tools/production-sync
        run: |
          node system-has-audit.mjs \
            "${{ runner.temp }}/swc-exports/tff-stations.csv" \
            "${{ runner.temp }}/swc-exports/tjo-stations.csv" \
            "${{ runner.temp }}/swc-exports/tff-materials.csv" \
            "${{ runner.temp }}/swc-exports/tjo-materials.csv" \
            audited-workbook-layout.json \
            "${{ runner.temp }}/system-has-audit.json"

      - name: Compare system HAS against live workbook (read only)
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          SWC_PRODUCTION_SHEET_ID: '1ezzYU4MYW9VyWWR2mJWQ6jmFlZKxPxvezZAscXtx5q8'
        run: |
          python3 tools/production-sync/compare-system-has.py \
            "${{ runner.temp }}/system-has-audit.json" \
            "${{ runner.temp }}/system-has-comparison.json"

      - name: Compare calculated HAS values with live workbook (read only)
        if: success()
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          SWC_PRODUCTION_SHEET_ID: '1ezzYU4MYW9VyWWR2mJWQ6jmFlZKxPxvezZAscXtx5q8'
        run: |
          python3 tools/production-sync/compare-live-sheet.py \
            "${{ runner.temp }}/audited-ledger.json" \
            "${{ runner.temp }}/spreadsheet-comparison.json"

      - name: Trace differences to material pile IDs and classify unassigned stations
        if: success()
        working-directory: tools/production-sync
        run: |
          node pile-trace.mjs \
            "${{ runner.temp }}/spreadsheet-comparison.json" \
            audited-workbook-layout.json \
            "${{ runner.temp }}/swc-exports/tff-stations.csv" \
            "${{ runner.temp }}/swc-exports/tjo-stations.csv" \
            "${{ runner.temp }}/swc-exports/tff-materials.csv" \
            "${{ runner.temp }}/swc-exports/tjo-materials.csv" \
            "${{ runner.temp }}/pile-trace.json"

      - name: Test production Started synchronization
        run: python3 -m unittest discover -s tools/production-sync -p 'test_sync*.py' -v

      - name: Preflight every tracked production Started cell (read only)
        if: success()
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          SWC_PRODUCTION_SHEET_ID: '1ezzYU4MYW9VyWWR2mJWQ6jmFlZKxPxvezZAscXtx5q8'
        run: |
          python3 tools/production-sync/sync-production-started.py \
            tools/production-sync/audited-workbook-layout.json \
            "${{ runner.temp }}/swc-exports/tff-stations.csv" \
            "${{ runner.temp }}/swc-exports/tjo-stations.csv" \
            "${{ runner.temp }}/production-started-preflight.json" false

      - name: Capture production preview workbook (read only)
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          SWC_PRODUCTION_SHEET_ID: '1ezzYU4MYW9VyWWR2mJWQ6jmFlZKxPxvezZAscXtx5q8'
        run: python3 tools/production-sync/capture-overview-snapshot.py tools/production-sync/audited-workbook-layout.json tools/production-sync/audited-production-orders.json "${{ runner.temp }}/preview-workbook.json"
      - name: Prepare projected production preview without writes
        run: |
          node tools/api-parity/prepare-sync-preview.mjs "${{ runner.temp }}/preview-workbook.json" "${{ runner.temp }}/audited-ledger.json" "${{ runner.temp }}/production-started-preflight.json" "${{ runner.temp }}/swc-exports" "${{ runner.temp }}/production-preview"
          node tools/production-sync/overview-shadow-audit.mjs --snapshot "${{ runner.temp }}/production-preview/projected-workbook.json" --overview "${{ runner.temp }}/production-preview/overview-readiness.json" --tff-stations "${{ runner.temp }}/swc-exports/tff-stations.csv" --tjo-stations "${{ runner.temp }}/swc-exports/tjo-stations.csv" --tff-materials "${{ runner.temp }}/swc-exports/tff-materials.csv" --tjo-materials "${{ runner.temp }}/swc-exports/tjo-materials.csv" --out "${{ runner.temp }}/production-preview/overview-shadow-audit.json"
          python3 tools/production-sync/overview-publish-preview.py "${{ runner.temp }}/production-preview/overview-readiness.json" "${{ runner.temp }}/production-preview/overview-shadow-audit.json" "${{ runner.temp }}/production-preview/overview-publish-preview.json"

      - name: Seal exact accepted API inputs for downstream publishing
        if: success() && matrix.source == 'api' && github.event_name == 'workflow_dispatch' && inputs.enable_has_writes == true && (steps.batch_gate.outputs.new_batch == 'true' || inputs.force_republish == true)
        run: node tools/api-parity/api-snapshot.mjs seal "${{ runner.temp }}/swc-exports" /tmp/swc-private/accepted-public-key.pem "${{ runner.temp }}/accepted-api-snapshot.encrypted.json"
      - name: Upload exact accepted API snapshot
        if: success() && matrix.source == 'api' && github.event_name == 'workflow_dispatch' && inputs.enable_has_writes == true && (steps.batch_gate.outputs.new_batch == 'true' || inputs.force_republish == true)
        uses: actions/upload-artifact@v4
        with:
          name: swc-accepted-api-snapshot
          path: ${{ runner.temp }}/accepted-api-snapshot.encrypted.json
          retention-days: 90

      - name: Apply and verify HAS updates (opt-in only)
        if: success() && github.event_name == 'workflow_dispatch' && inputs.enable_has_writes == true && (steps.batch_gate.outputs.new_batch == 'true' || inputs.force_republish == true)
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          SWC_PRODUCTION_SHEET_ID: '1ezzYU4MYW9VyWWR2mJWQ6jmFlZKxPxvezZAscXtx5q8'
          SWC_ENABLE_HAS_WRITES: 'true'
        run: |
          python3 tools/production-sync/write-verified-has.py \
            "${{ runner.temp }}/spreadsheet-comparison.json" \
            "${{ runner.temp }}/system-has-comparison.json" \
            "${{ runner.temp }}/has-write-report.json"

      - name: Synchronize and verify production Started flags from station exports
        if: success() && github.event_name == 'workflow_dispatch' && inputs.enable_has_writes == true && (steps.batch_gate.outputs.new_batch == 'true' || inputs.force_republish == true)
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          SWC_PRODUCTION_SHEET_ID: '1ezzYU4MYW9VyWWR2mJWQ6jmFlZKxPxvezZAscXtx5q8'
        run: |
          python3 tools/production-sync/sync-production-started.py \
            tools/production-sync/audited-workbook-layout.json \
            "${{ runner.temp }}/swc-exports/tff-stations.csv" \
            "${{ runner.temp }}/swc-exports/tjo-stations.csv" \
            "${{ runner.temp }}/production-started-write-report.json" true

      - name: Accept verified export batch (no cleanup)
        if: success() && github.event_name == 'workflow_dispatch' && inputs.enable_has_writes == true && (steps.batch_gate.outputs.new_batch == 'true' || inputs.force_republish == true)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 tools/production-sync/accept-export-batch.py \
            "${{ runner.temp }}/swc-exports/export-manifest.json" \
            "${{ runner.temp }}/has-write-report.json" \
            "${{ runner.temp }}/batch-acceptance-report.json"

      - name: Rename superseded and accepted exports (opt-in, after verification)
        if: success() && github.event_name == 'workflow_dispatch' && inputs.enable_has_writes == true && matrix.source == 'csv' && inputs.trash_superseded_exports == true && (steps.batch_gate.outputs.new_batch == 'true' || inputs.force_republish == true)
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          SWC_EXPORT_FOLDER_ID: '1oGgiWgYZzPvfk6Kcjp_jeAY55eIREY28'
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 tools/production-sync/trash-superseded-exports.py \
            "${{ runner.temp }}/swc-exports/export-manifest.json" \
            "${{ runner.temp }}/batch-acceptance-report.json" \
            "${{ runner.temp }}/trash-report.json"

      - name: Seal private dry-run diagnostics
        if: always() && github.event_name == 'push'
        run: node tools/api-parity/seal-sync-diagnostics.mjs "${{ runner.temp }}" tools/api-parity/production-audit-public-key.pem "${{ runner.temp }}/sync-preview.encrypted.json"
      - name: Upload encrypted dry-run preview
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: swc-dry-run-${{ matrix.source }}
          path: |
            ${{ runner.temp }}/sync-preview.encrypted.json
            ${{ runner.temp }}/production-preview/preview-summary.json
          retention-days: 7
      - name: Upload dry-run ledger or diagnostics
        if: always() && github.event_name != 'push' 
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'push' && format('swc-dry-run-{0}', matrix.source) || 'swc-audited-ledger' }}
          path: |
            ${{ runner.temp }}/production-preview/preview-summary.json
            ${{ runner.temp }}/production-preview/overview-publish-preview.json
            ${{ runner.temp }}/swc-exports/export-manifest.json
            ${{ runner.temp }}/swc-exports/cleanup-plan.json
            ${{ runner.temp }}/tooling-infotext-report.json
            ${{ runner.temp }}/audited-ledger.json
            ${{ runner.temp }}/spreadsheet-comparison.json
            ${{ runner.temp }}/pile-trace.json
            ${{ runner.temp }}/station-registry-audit.json
            ${{ runner.temp }}/station-registry-bootstrap.json
            ${{ runner.temp }}/system-has-audit.json
            ${{ runner.temp }}/system-has-comparison.json
            ${{ runner.temp }}/has-write-report.json
            ${{ runner.temp }}/production-started-preflight.json
            ${{ runner.temp }}/production-started-write-report.json
            ${{ runner.temp }}/batch-acceptance-report.json
            ${{ runner.temp }}/trash-report.json
          retention-days: 90
          if-no-files-found: warn

      - name: Remove private API credentials
        if: always() && matrix.source == 'api'
        run: rm -rf /tmp/swc-private
