name: SWC production CSV dry run

on:
  workflow_dispatch:
    inputs:
      enable_has_writes:
        description: 'Write validated HAS changes to Google Sheets (default: false)'
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: swc-production-dry-run
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out audited branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Authenticate Google Drive and Sheets
        id: google
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/772242617730/locations/global/workloadIdentityPools/github-actions/providers/github'
          service_account: 'swc-production-sync@swc-analytics-512519.iam.gserviceaccount.com'
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly,https://www.googleapis.com/auth/drive.file,https://www.googleapis.com/auth/spreadsheets

      - name: Download four exports from private Drive folder
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          SWC_EXPORT_FOLDER_ID: '1oGgiWgYZzPvfk6Kcjp_jeAY55eIREY28'
          SWC_EXPORT_OUTPUT: ${{ runner.temp }}/swc-exports
        run: python3 tools/production-sync/download-drive-exports.py

      - name: Test export auto-discovery
        run: python3 -m unittest discover -s tools/production-sync -p 'test_download_drive_exports.py' -v

      - name: Audit tooling and infotext (advisory only)
        working-directory: tools/production-sync
        run: |
          node tooling-infotext-audit.mjs \
            "${{ runner.temp }}/swc-exports/tff-stations.csv" \
            "${{ runner.temp }}/swc-exports/tjo-stations.csv" \
            "${{ runner.temp }}/tooling-infotext-report.json"

      - name: Run inventory unit tests
        working-directory: tools/production-sync
        run: node --test production-sync.test.mjs audited-inventory.test.mjs station-registry-audit.test.mjs system-has-audit.test.mjs

      - name: Calculate audited inventory (no spreadsheet writes)
        working-directory: tools/production-sync
        run: |
          node audited-inventory.mjs \
            --tff-materials "${{ runner.temp }}/swc-exports/tff-materials.csv" \
            --tjo-materials "${{ runner.temp }}/swc-exports/tjo-materials.csv" \
            --tff-stations "${{ runner.temp }}/swc-exports/tff-stations.csv" \
            --tjo-stations "${{ runner.temp }}/swc-exports/tjo-stations.csv" \
            --manifest audited-workbook-layout.json \
            --out "${{ runner.temp }}/audited-ledger.json"

      - name: Audit complete station registry and untracked TJO shipyards (read only)
        working-directory: tools/production-sync
        run: |
          BASELINE="station-registry-baseline.json"
          if [ ! -f "$BASELINE" ]; then BASELINE="-"; fi
          node station-registry-audit.mjs \
            "${{ runner.temp }}/swc-exports/tff-stations.csv" \
            "${{ runner.temp }}/swc-exports/tjo-stations.csv" \
            audited-workbook-layout.json \
            "$BASELINE" \
            "${{ runner.temp }}/station-registry-audit.json" \
            "${{ runner.temp }}/station-registry-bootstrap.json"

      - name: Calculate complete system orbital HAS (read only)
        working-directory: tools/production-sync
        run: |
          node system-has-audit.mjs \
            "${{ runner.temp }}/swc-exports/tff-stations.csv" \
            "${{ runner.temp }}/swc-exports/tjo-stations.csv" \
            "${{ runner.temp }}/swc-exports/tff-materials.csv" \
            "${{ runner.temp }}/swc-exports/tjo-materials.csv" \
            audited-workbook-layout.json \
            "${{ runner.temp }}/system-has-audit.json"

      - name: Compare system HAS against live workbook (read only)
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          SWC_PRODUCTION_SHEET_ID: '1ezzYU4MYW9VyWWR2mJWQ6jmFlZKxPxvezZAscXtx5q8'
        run: |
          python3 tools/production-sync/compare-system-has.py \
            "${{ runner.temp }}/system-has-audit.json" \
            "${{ runner.temp }}/system-has-comparison.json"

      - name: Compare calculated HAS values with live workbook (read only)
        if: success()
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          SWC_PRODUCTION_SHEET_ID: '1ezzYU4MYW9VyWWR2mJWQ6jmFlZKxPxvezZAscXtx5q8'
        run: |
          python3 tools/production-sync/compare-live-sheet.py \
            "${{ runner.temp }}/audited-ledger.json" \
            "${{ runner.temp }}/spreadsheet-comparison.json"

      - name: Trace differences to material pile IDs and classify unassigned stations
        if: success()
        working-directory: tools/production-sync
        run: |
          node pile-trace.mjs \
            "${{ runner.temp }}/spreadsheet-comparison.json" \
            audited-workbook-layout.json \
            "${{ runner.temp }}/swc-exports/tff-stations.csv" \
            "${{ runner.temp }}/swc-exports/tjo-stations.csv" \
            "${{ runner.temp }}/swc-exports/tff-materials.csv" \
            "${{ runner.temp }}/swc-exports/tjo-materials.csv" \
            "${{ runner.temp }}/pile-trace.json"

      - name: Apply and verify HAS updates (opt-in only)
        if: success() && inputs.enable_has_writes == true
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          SWC_PRODUCTION_SHEET_ID: '1ezzYU4MYW9VyWWR2mJWQ6jmFlZKxPxvezZAscXtx5q8'
          SWC_ENABLE_HAS_WRITES: 'true'
        run: |
          python3 tools/production-sync/write-verified-has.py \
            "${{ runner.temp }}/spreadsheet-comparison.json" \
            "${{ runner.temp }}/system-has-comparison.json" \
            "${{ runner.temp }}/has-write-report.json"

      - name: Accept verified export batch (no cleanup)
        if: success() && inputs.enable_has_writes == true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 tools/production-sync/accept-export-batch.py \
            "${{ runner.temp }}/swc-exports/export-manifest.json" \
            "${{ runner.temp }}/has-write-report.json" \
            "${{ runner.temp }}/batch-acceptance-report.json"

      - name: Upload dry-run ledger or diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swc-audited-ledger
          path: |
            ${{ runner.temp }}/swc-exports/export-manifest.json
            ${{ runner.temp }}/swc-exports/cleanup-plan.json
            ${{ runner.temp }}/tooling-infotext-report.json
            ${{ runner.temp }}/audited-ledger.json
            ${{ runner.temp }}/spreadsheet-comparison.json
            ${{ runner.temp }}/pile-trace.json
            ${{ runner.temp }}/station-registry-audit.json
            ${{ runner.temp }}/station-registry-bootstrap.json
            ${{ runner.temp }}/system-has-audit.json
            ${{ runner.temp }}/system-has-comparison.json
            ${{ runner.temp }}/has-write-report.json
            ${{ runner.temp }}/batch-acceptance-report.json
          retention-days: 90
          if-no-files-found: warn
