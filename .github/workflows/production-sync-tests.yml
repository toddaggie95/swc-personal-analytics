name: Production sync tests
on:
  pull_request:
    paths:
      - 'tools/production-sync/**'
      - '.github/workflows/production-sync-tests.yml'
  push:
    branches:
      - feature/audited-production-destinations
    paths:
      - 'tools/production-sync/**'
      - '.github/workflows/production-sync-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic and audited inventory tests
        run: node --test tools/production-sync/*.test.mjs
