name: SWC API - Mine Audit
on:
  workflow_dispatch:
    inputs:
      system:
        description: Star system to audit
        type: choice
        options: [Eberon, Kashyyyk, Tholatin, Chamble, All]
        default: Eberon
        required: true
      resume_run_id:
        description: Prior Mine Audit run ID for the same scope (optional)
        type: string
        required: false
      resume_eligible:
        description: Approve live resumes for all eligible mines in this fresh All run
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: swc-api-shadow-oauth
  cancel-in-progress: false
jobs:
  audit:
    if: inputs.system != 'All' || inputs.resume_run_id != ''
    runs-on: ubuntu-latest
    environment: swc-api-shadow
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Stage the existing SWC credential privately
        id: credential
        env:
          SWC_OAUTH_TOKENS_JSON: ${{ secrets.SWC_OAUTH_TOKENS_JSON }}
        run: |
          umask 077
          mkdir "$RUNNER_TEMP/swc-mine-private"
          node --input-type=module <<'NODE'
          import {appendFileSync, writeFileSync} from 'node:fs';
          const saved = JSON.parse(process.env.SWC_OAUTH_TOKENS_JSON || '{}');
          if (!saved.accessToken || !Number.isFinite(saved.expiresAt)) throw Error('SWC credential unavailable.');
          writeFileSync(process.env.RUNNER_TEMP + '/swc-mine-private/tokens.json', JSON.stringify(saved));
          appendFileSync(process.env.GITHUB_OUTPUT, 'refresh=' + (saved.expiresAt < Date.now() + 45 * 60_000) + '\n');
          NODE
      - uses: actions/checkout@v4
        if: steps.credential.outputs.refresh == 'true'
        with:
          ref: e5e09317db242662b7fb77aa8b46bbe637e070ae
          path: collector
          persist-credentials: false
      - name: Refresh using the shared durable OAuth coordinator
        if: steps.credential.outputs.refresh == 'true'
        working-directory: collector
        env:
          SWC_PRIVATE_DIR: ${{ runner.temp }}/swc-mine-private
          SWC_CLIENT_ID: ${{ secrets.SWC_CLIENT_ID }}
          SWC_CLIENT_SECRET: ${{ secrets.SWC_CLIENT_SECRET }}
          SWC_SECRET_WRITER_TOKEN: ${{ secrets.SWC_SECRET_WRITER_TOKEN }}
          SWC_APP_ACTIVATED: 'true'
          SWC_SECRET_REGENERATED: 'true'
          SWC_FORCE_REFRESH: 'true'
        run: |
          set -euo pipefail
          cp ../src/auth/*.ts src/auth/
          cp ../src/cli/github-auth-probe.ts src/cli/
          npm ci --ignore-scripts --no-audit --no-fund >/dev/null
          npx --no-install tsx src/cli/github-auth-probe.ts
      - name: Download the encrypted checkpoint for this workflow
        if: inputs.resume_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          set -euo pipefail
          [[ "$RESUME_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RESUME_RUN_ID" \
            --jq '.path == ".github/workflows/swc-kashyyyk-mine-audit.yml" and .head_branch == "main" and .conclusion == "success"' | grep -qx true
          url=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RESUME_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "system-mine-audit-progress" and .expired == false) | .archive_download_url')
          test -n "$url"
          gh api "$url" > "$RUNNER_TEMP/mine-audit-progress.zip"
          unzip -p "$RUNNER_TEMP/mine-audit-progress.zip" mine-audit-progress.encrypted.json > "$RUNNER_TEMP/mine-audit-progress.input.json"
      - name: Audit system mine inventory and detail using GET
        env:
          SWC_API_SNAPSHOT_PRIVATE_KEY: ${{ secrets.SWC_API_SNAPSHOT_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' | tee -a "$GITHUB_STEP_SUMMARY"
          import {existsSync, readFileSync, writeFileSync} from 'node:fs';
          import {createPublicKey} from 'node:crypto';
          import {join} from 'node:path';
          import {createMineRead, DEFAULT_MATERIALS, liveInventory, MineReadStop, SYSTEM_UIDS} from './tools/mine-restart/discover.mjs';
          import {decrypt, encrypt} from './tools/api-parity/private-audit-envelope.mjs';
          import {minePlanIdentity, restoreMineProgress} from './tools/mine-restart/audit-progress.mjs';
          import {classifyMine as classify, mineClassificationContract, summarizeMineOperations, summarizeUnfamiliarInfotext} from './tools/mine-restart/audit-classifier.mjs';

          const {accessToken, expiresAt} = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'swc-mine-private', 'tokens.json'), 'utf8'));
          if (typeof accessToken !== 'string' || !accessToken || !Number.isFinite(expiresAt) ||
              expiresAt < Date.now() + 45 * 60_000) throw Error('Run with a current Production Sync credential.');
          const system = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8')).inputs?.system;
          const systemUid = system === 'All' ? null : SYSTEM_UIDS.get(system);
          if (systemUid === undefined) throw Error('Unsupported audit system.');
          const checkpointKey = process.env.SWC_API_SNAPSHOT_PRIVATE_KEY;
          const checkpointInput = join(process.env.RUNNER_TEMP, 'mine-audit-progress.input.json');
          if ((system === 'All' || existsSync(checkpointInput)) && !checkpointKey) throw Error('Existing audit checkpoint key unavailable.');
          const report = {system, observedFrom: new Date().toISOString(), coverage: [], mines: []};
          const list = [];
          const allowlist = DEFAULT_MATERIALS;
          const read = await createMineRead(accessToken, Math.min(expiresAt - 10_000, Date.now() + 33 * 60_000));
          for (const owner of ['20:1174', '20:1838']) {
            try {
              const {rows} = await liveInventory([owner], systemUid, read);
              list.push(...rows.map(row => ({uid: row.uid, ownerUid: owner, name: row.name,
                systemUid: row.location?.system?.attributes?.uid ?? null, system: row.location?.system?.value ?? null})));
              report.coverage.push({owner, status: 'inventory-complete', count: rows.length});
            } catch (error) {
              report.coverage.push({owner, status: 'inventory-unavailable',
                reason: error instanceof MineReadStop ? error.message : 'facility inventory read unavailable'});
            }
          }
          const inventoryComplete = report.coverage.every(c => c.status === 'inventory-complete');
          const identity = minePlanIdentity(system, list, allowlist, mineClassificationContract);
          let completed = new Map();
          if (existsSync(checkpointInput)) {
            if (!inventoryComplete) throw Error('Cannot resume against incomplete owner inventories.');
            const prior = JSON.parse(decrypt(JSON.parse(readFileSync(checkpointInput, 'utf8')), checkpointKey));
            completed = restoreMineProgress(prior, identity, list);
            report.observedFrom = prior.observedFrom;
          }
          report.resumedDetails = completed.size;
          let stopReason;
          let attempted = 0;
          for (const listed of list) {
            if (completed.has(listed.uid)) {
              report.mines.push(completed.get(listed.uid));
              continue;
            }
            if (system === 'All' && attempted >= 350) stopReason ??= 'detail batch limit reached';
            if (!stopReason) {
              attempted++;
              try {
                const response = await read.get('inventory/facilities/' + listed.uid + '/');
                if (!response.ok) throw Error('detail HTTP ' + response.status);
                const body = await response.json();
                const e = body.swcapi?.entity?.value ?? body.swcapi?.entity;
                if (e?.uid !== listed.uid || e.owner?.attributes?.uid !== listed.ownerUid ||
                    e.type?.attributes?.uid !== '4:36' ||
                    (e.location?.system?.attributes?.uid ?? null) !== listed.systemUid) throw Error('detail identity mismatch');
                const row = {...classify(listed, e, allowlist), systemUid: listed.systemUid, system: listed.system,
                  observedAt: new Date().toISOString()};
                if (!listed.systemUid && row.classification === 'candidate') {
                  row.classification = 'manual-review';
                  row.category = 'manual-review';
                  row.reasons.push('system location unverified');
                }
                completed.set(listed.uid, row);
                report.mines.push(row);
                continue;
              } catch (error) {
                if (error instanceof MineReadStop) stopReason = error.message;
                const reason = stopReason ?? (/^(detail HTTP \d{3}|detail identity mismatch)$/.test(error.message) ?
                  error.message : 'detail request unavailable');
                report.mines.push({...listed, classification: 'manual-review', category: 'manual-review', detailsUnavailable: true, reasons: [reason]});
                continue;
              }
            }
            report.mines.push({...listed, classification: 'manual-review', category: 'manual-review', detailsUnavailable: true, reasons: [stopReason]});
          }
          report.observedTo = new Date().toISOString();
          report.allowlist = allowlist;
          report.readMetrics = read.summary();
          report.unfamiliarInfotext = summarizeUnfamiliarInfotext(report.mines);
          report.operations = summarizeMineOperations(report.mines);
          const operationalCounts = Object.fromEntries(Object.entries(report.operations).map(([key, rows]) => [key, rows.length]));
          report.complete = inventoryComplete && completed.size === list.length;
          report.checkedDetails = completed.size;
          report.pendingDetails = list.length - completed.size;
          const counts = Object.fromEntries(['candidate', 'excluded', 'manual-review'].map(c =>
            [c, report.mines.filter(m => m.classification === c).length]));
          const key = readFileSync('tools/planet-api/snapshot-analysis-public-key.pem');
          writeFileSync(join(process.env.RUNNER_TEMP, 'system-mine-audit.encrypted.json'),
            JSON.stringify(encrypt(Buffer.from(JSON.stringify(report)), key)), {mode: 0o600});
          const categories = Object.fromEntries(['depleted', 'reported-depleted', 'do-not-restart', 'paused-no-mine-space', 'paused-with-space-candidate', 'already-running', 'other-excluded', 'manual-review'].map(category =>
            [category, report.mines.filter(m => m.category === category).length]));
          if (checkpointKey && inventoryComplete && !report.complete && completed.size) {
            const checkpoint = {version: 1, identity, observedFrom: report.observedFrom, entries: [...completed.values()]};
            writeFileSync(join(process.env.RUNNER_TEMP, 'mine-audit-progress.encrypted.json'),
              JSON.stringify(encrypt(Buffer.from(JSON.stringify(checkpoint)), createPublicKey(checkpointKey))), {mode: 0o600});
          }
          console.log(JSON.stringify({system, complete: report.complete, checkedDetails: report.checkedDetails,
            pendingDetails: report.pendingDetails, resumedDetails: report.resumedDetails, operationalCounts, unfamiliarInfotextValues: report.unfamiliarInfotext.length,
            minesWithUnfamiliarInfotext: report.unfamiliarInfotext.reduce((sum, note) => sum + note.mines.length, 0), ...counts, categories, readMetrics: report.readMetrics}));
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: system-mine-audit-encrypted
          path: ${{ runner.temp }}/system-mine-audit.encrypted.json
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: system-mine-audit-progress
          path: ${{ runner.temp }}/mine-audit-progress.encrypted.json
          retention-days: 2
          if-no-files-found: ignore
      - name: Remove temporary OAuth data
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/swc-mine-private"

  plan-mine-batches:
    if: inputs.system == 'All' && inputs.resume_run_id == ''
    runs-on: ubuntu-latest
    environment: swc-api-shadow
    timeout-minutes: 18
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_batches: ${{ steps.plan.outputs.has_batches }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Stage the existing SWC credential privately
        id: credential
        env:
          SWC_OAUTH_TOKENS_JSON: ${{ secrets.SWC_OAUTH_TOKENS_JSON }}
        run: |
          umask 077
          mkdir "$RUNNER_TEMP/swc-mine-private"
          node --input-type=module <<'NODE'
          import {appendFileSync, writeFileSync} from 'node:fs';
          const saved = JSON.parse(process.env.SWC_OAUTH_TOKENS_JSON || '{}');
          if (!saved.accessToken || !Number.isFinite(saved.expiresAt)) throw Error('SWC credential unavailable.');
          writeFileSync(process.env.RUNNER_TEMP + '/swc-mine-private/tokens.json', JSON.stringify(saved));
          appendFileSync(process.env.GITHUB_OUTPUT, 'refresh=' + (saved.expiresAt < Date.now() + 45 * 60_000) + '\n');
          NODE
      - uses: actions/checkout@v4
        if: steps.credential.outputs.refresh == 'true'
        with:
          ref: e5e09317db242662b7fb77aa8b46bbe637e070ae
          path: collector
          persist-credentials: false
      - name: Refresh using the shared durable OAuth coordinator
        if: steps.credential.outputs.refresh == 'true'
        working-directory: collector
        env:
          SWC_PRIVATE_DIR: ${{ runner.temp }}/swc-mine-private
          SWC_CLIENT_ID: ${{ secrets.SWC_CLIENT_ID }}
          SWC_CLIENT_SECRET: ${{ secrets.SWC_CLIENT_SECRET }}
          SWC_SECRET_WRITER_TOKEN: ${{ secrets.SWC_SECRET_WRITER_TOKEN }}
          SWC_APP_ACTIVATED: 'true'
          SWC_SECRET_REGENERATED: 'true'
          SWC_FORCE_REFRESH: 'true'
        run: |
          set -euo pipefail
          cp ../src/auth/*.ts src/auth/
          cp ../src/cli/github-auth-probe.ts src/cli/
          npm ci --ignore-scripts --no-audit --no-fund >/dev/null
          npx --no-install tsx src/cli/github-auth-probe.ts
      - name: Scan owner inventories once and plan mine batches
        id: plan
        env:
          SWC_API_SNAPSHOT_PRIVATE_KEY: ${{ secrets.SWC_API_SNAPSHOT_PRIVATE_KEY }}
        run: node tools/mine-restart/parallel-audit.mjs plan
      - uses: actions/upload-artifact@v4
        with:
          name: parallel-mine-plan
          path: ${{ runner.temp }}/parallel-mine-plan.encrypted.json
          retention-days: 2
          if-no-files-found: error
      - name: Remove temporary OAuth data
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/swc-mine-private"

  mine-detail-batches:
    needs: plan-mine-batches
    if: needs.plan-mine-batches.outputs.has_batches == 'true'
    runs-on: ubuntu-latest
    environment: swc-api-shadow
    timeout-minutes: 16
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan-mine-batches.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: parallel-mine-plan
          path: ${{ runner.temp }}
      - name: Stage an access-only credential
        env:
          SWC_OAUTH_TOKENS_JSON: ${{ secrets.SWC_OAUTH_TOKENS_JSON }}
        run: |
          umask 077
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          const {accessToken, expiresAt} = JSON.parse(process.env.SWC_OAUTH_TOKENS_JSON || '{}');
          if (typeof accessToken !== 'string' || !accessToken.trim() || !Number.isFinite(expiresAt) ||
              expiresAt < Date.now() + 15 * 60_000) throw Error('Worker access token unavailable or too close to expiry.');
          writeFileSync(process.env.RUNNER_TEMP + '/mine-worker-access.json', JSON.stringify({accessToken, expiresAt}));
          NODE
      - name: Read one batch of mine details
        env:
          MINE_BATCH: ${{ matrix.batch }}
          SWC_API_SNAPSHOT_PRIVATE_KEY: ${{ secrets.SWC_API_SNAPSHOT_PRIVATE_KEY }}
        run: node tools/mine-restart/parallel-audit.mjs worker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mine-detail-worker-${{ matrix.batch }}
          path: ${{ runner.temp }}/mine-worker-${{ matrix.batch }}.encrypted.json
          retention-days: 2
          if-no-files-found: ignore
      - name: Remove temporary access token
        if: always()
        run: rm -f -- "$RUNNER_TEMP/mine-worker-access.json"

  assemble-mine-audit:
    needs: [plan-mine-batches, mine-detail-batches]
    if: always() && needs.plan-mine-batches.result == 'success' && !cancelled()
    runs-on: ubuntu-latest
    environment: swc-api-shadow
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: parallel-mine-plan
          path: ${{ runner.temp }}
      - name: Prepare worker result directory
        run: mkdir -p "$RUNNER_TEMP/mine-worker-results"
      - uses: actions/download-artifact@v4
        if: needs.plan-mine-batches.outputs.has_batches == 'true'
        with:
          pattern: mine-detail-worker-*
          path: ${{ runner.temp }}/mine-worker-results
      - name: Verify coverage and assemble one encrypted mine audit
        env:
          SWC_PREPARE_RESUME: ${{ inputs.resume_eligible && github.run_attempt == '1' && github.ref == 'refs/heads/main' }}
          SWC_API_SNAPSHOT_PRIVATE_KEY: ${{ secrets.SWC_API_SNAPSHOT_PRIVATE_KEY }}
        run: |
          set -eo pipefail
          node tools/mine-restart/parallel-audit.mjs assemble | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: system-mine-audit-encrypted
          path: ${{ runner.temp }}/system-mine-audit.encrypted.json
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: inputs.resume_eligible && github.run_attempt == '1' && github.ref == 'refs/heads/main'
        with:
          name: mine-resume-plan
          path: ${{ runner.temp }}/mine-resume-plan.encrypted.json
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: system-mine-audit-progress
          path: ${{ runner.temp }}/mine-audit-progress.encrypted.json
          retention-days: 2
          if-no-files-found: ignore

  resume-eligible-mines:
    needs: assemble-mine-audit
    if: inputs.resume_eligible && inputs.system == 'All' && inputs.resume_run_id == '' && github.run_attempt == '1' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: swc-api-shadow
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: mine-resume-plan
          path: ${{ runner.temp }}
      - name: Recheck each audited mine, resume once, and verify
        env:
          SWC_MINE_PILOT_TOKENS_JSON: ${{ secrets.SWC_MINE_PILOT_TOKENS_JSON }}
          SWC_API_SNAPSHOT_PRIVATE_KEY: ${{ secrets.SWC_API_SNAPSHOT_PRIVATE_KEY }}
        run: |
          set -eo pipefail
          node tools/mine-restart/resume-audited-mines.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mine-resume-report-encrypted
          path: ${{ runner.temp }}/mine-resume-report.encrypted.json
          retention-days: 7
          if-no-files-found: ignore
