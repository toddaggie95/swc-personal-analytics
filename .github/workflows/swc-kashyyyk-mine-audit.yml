name: SWC API - Mine Audit
on:
  workflow_dispatch:
    inputs:
      system:
        description: Star system to audit
        type: choice
        options: [Eberon, Kashyyyk, Tholatin, Chamble]
        default: Eberon
        required: true
permissions:
  contents: read
concurrency:
  group: swc-api-shadow-oauth
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: swc-api-shadow
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Stage the existing SWC credential privately
        id: credential
        env:
          SWC_OAUTH_TOKENS_JSON: ${{ secrets.SWC_OAUTH_TOKENS_JSON }}
        run: |
          umask 077
          mkdir "$RUNNER_TEMP/swc-mine-private"
          node --input-type=module <<'NODE'
          import {appendFileSync, writeFileSync} from 'node:fs';
          const saved = JSON.parse(process.env.SWC_OAUTH_TOKENS_JSON || '{}');
          if (!saved.accessToken || !Number.isFinite(saved.expiresAt)) throw Error('SWC credential unavailable.');
          writeFileSync(process.env.RUNNER_TEMP + '/swc-mine-private/tokens.json', JSON.stringify(saved));
          appendFileSync(process.env.GITHUB_OUTPUT, 'refresh=' + (saved.expiresAt < Date.now() + 45 * 60_000) + '\n');
          NODE
      - uses: actions/checkout@v4
        if: steps.credential.outputs.refresh == 'true'
        with:
          ref: e5e09317db242662b7fb77aa8b46bbe637e070ae
          path: collector
          persist-credentials: false
      - name: Refresh using the shared durable OAuth coordinator
        if: steps.credential.outputs.refresh == 'true'
        working-directory: collector
        env:
          SWC_PRIVATE_DIR: ${{ runner.temp }}/swc-mine-private
          SWC_CLIENT_ID: ${{ secrets.SWC_CLIENT_ID }}
          SWC_CLIENT_SECRET: ${{ secrets.SWC_CLIENT_SECRET }}
          SWC_SECRET_WRITER_TOKEN: ${{ secrets.SWC_SECRET_WRITER_TOKEN }}
          SWC_APP_ACTIVATED: 'true'
          SWC_SECRET_REGENERATED: 'true'
          SWC_FORCE_REFRESH: 'true'
        run: |
          set -euo pipefail
          cp ../src/auth/*.ts src/auth/
          cp ../src/cli/github-auth-probe.ts src/cli/
          npm ci --ignore-scripts --no-audit --no-fund >/dev/null
          npx --no-install tsx src/cli/github-auth-probe.ts
      - name: Audit system mine inventory and detail using GET
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' | tee -a "$GITHUB_STEP_SUMMARY"
          import {spawnSync} from 'node:child_process';
          import {mkdtempSync, readFileSync, rmSync, writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          import {setTimeout as delay} from 'node:timers/promises';
          import {encrypt} from './tools/api-parity/private-audit-envelope.mjs';

          const {accessToken, expiresAt} = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'swc-mine-private', 'tokens.json'), 'utf8'));
          if (typeof accessToken !== 'string' || !accessToken || !Number.isFinite(expiresAt) ||
              expiresAt < Date.now() + 45 * 60_000) throw Error('Run with a current Production Sync credential.');
          const temp = mkdtempSync(join(process.env.RUNNER_TEMP, 'mine-inventory-'));
          const system = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8')).inputs?.system;
          const systemUid = new Map([['Eberon', '9:22'], ['Kashyyyk', '9:104'], ['Chamble', '9:103'], ['Tholatin', '9:190']]).get(system);
          if (!systemUid) throw Error('Unsupported audit system.');
          const report = {system, observedFrom: new Date().toISOString(), coverage: [], mines: []};
          function classify(listed, e, allowlist) {
            const excluded = [], review = [];
            const norm = value => typeof value === 'string' ? value.trim().toLowerCase() : '';
            const positive = value => Number.isSafeInteger(value) && value > 0;
            const action = e.actions?.action?.length === 1 && Array.isArray(e.actions.action) ? e.actions.action[0] : null;
            const status = norm(action?.value?.status);
            const mining = [action?.attributes?.type, action?.value?.actiontype].some(v => ['mine', 'mining'].includes(norm(v)));
            if (mining && ['running', 'active', 'in progress', 'mining'].includes(status)) excluded.push('mining already running');
            else if (!mining || !['paused', 'mining paused'].includes(status) || !positive(action?.attributes?.id)) review.push('single paused mining action unverified');
            const deposit = Array.isArray(e.deposits?.deposit) && e.deposits.deposit.length === 1 ? e.deposits.deposit[0] : null;
            const material = norm(deposit?.value), quantity = deposit?.attributes?.quantity;
            const expectedYield = action?.value?.['expected-yield'];
            const volume = e.cargo?.volumecapacity;
            if (!material) review.push('single deposit material unverified');
            else if (!allowlist.includes(material)) excluded.push('material outside current allowlist');
            if (quantity === 0) excluded.push('deposit depleted');
            else if (!positive(quantity) || !positive(expectedYield) || quantity < expectedYield) review.push('deposit sufficient for next cycle unverified');
            if (volume?.remaining === 0 && Number.isFinite(volume?.total) && volume.total > 0) {
              review.push('mine cargo reports zero free volume; linked storage unverified');
            } else if (!positive(expectedYield) || !Number.isFinite(volume?.remaining) ||
                !Number.isFinite(volume?.total) || volume.remaining > volume.total || volume.remaining < expectedYield) {
              review.push('mine storage for next cycle unverified; linked storage not counted');
            }
            if (expectedYield === 0 && action?.value?.['expected-cost'] === 0) {
              review.push('SWC reports zero expected yield and zero expected cost');
            }
            if (norm(e.ispowered) === 'no' || norm(e.underconstruction) === 'yes' || norm(e.wrecked) === 'yes') excluded.push('facility unpowered, incomplete or wrecked');
            else if (norm(e.ispowered) !== 'yes' || norm(e.underconstruction) !== 'no' || norm(e.wrecked) !== 'no') review.push('facility condition unverified');
            const tags = e.tags?.tag;
            const notes = [e.name, e.infotext, ...(Array.isArray(tags) ? tags.map(t => t?.value ?? t) : [])];
            const hold = /\b(?:do not|don['’]?t|never)\s+(?:resume|restart|start|mine)|\b(?:hold|reserved|leave (?:off|paused)|no mining)\b/i;
            if (notes.some(v => hold.test(norm(v).replace(/[_-]+/g, ' ')))) excluded.push('explicit hold notation');
            if (quantity !== 0 && notes.some(v => /\bdepleted\b/.test(norm(v).replace(/[_-]+/g, ' ')))) {
              review.push('depletion notation conflicts with or is unverified by the deposit reading');
            }
            if (typeof e.infotext !== 'string' || e.infotext.trim() || !Array.isArray(tags) || tags.length) review.push('annotations require review');
            if (!/^1:\d+$/.test(e.pilot?.attributes?.uid ?? '') || !positive(action?.value?.workers) ||
                !positive(action?.value?.['expected-cost'])) review.push('operator, workers or expected cost unverified');
            const paused = mining && ['paused', 'mining paused'].includes(status) && positive(action?.attributes?.id);
            const classification = excluded.length ? 'excluded' : review.length ? 'manual-review' : 'candidate';
            const category = excluded.includes('explicit hold notation') ? 'do-not-restart'
              : quantity === 0 ? 'depleted'
              : excluded.includes('mining already running') ? 'already-running'
              : excluded.length ? 'other-excluded'
              : paused && (volume?.remaining === 0 || (positive(expectedYield) && Number.isFinite(volume?.remaining) && volume.remaining >= 0 && volume.remaining < expectedYield)) ? 'paused-no-mine-space'
              : classification === 'candidate' ? 'paused-with-space-candidate' : 'manual-review';
            return {uid: listed.uid, ownerUid: listed.ownerUid, name: e.name, planet: e.location?.planet?.value,
              city: e.location?.city?.value, material, quantity, expectedYield, remainingVolume: volume?.remaining,
              expectedCost: action?.value?.['expected-cost'], status, infotext: e.infotext, tags,
              classification, category,
              reasons: [...excluded, ...review]};
          }

          const list = [];
          let allowlist;
          try {
            for (const owner of ['20:1174', '20:1838']) {
              if (report.coverage.length) await delay(6500);
              const output = join(temp, owner.replace(':', '-') + '.json');
              const result = spawnSync(process.execPath, ['tools/mine-restart/discover.mjs', '--owner', owner, '--system', system, '--output', output],
                {env: {...process.env, SWC_ACCESS_TOKEN: accessToken}, timeout: 300_000});
              if (result.status !== 0) {
                report.coverage.push({owner, status: 'inventory-unavailable'});
                continue;
              }
              const inventory = JSON.parse(readFileSync(output, 'utf8'));
              allowlist = inventory.allowlist;
              list.push(...inventory.mines);
              report.coverage.push({owner, status: 'inventory-complete', count: inventory.mines.length});
            }
          } finally {
            rmSync(temp, {recursive: true, force: true});
          }
          let stopReason;
          const deadline = Date.now() + 31 * 60_000;
          for (const listed of list) {
            if (!stopReason && (Date.now() + 40_000 >= deadline || Date.now() + 40_000 >= expiresAt)) stopReason = 'detail time budget exhausted';
            if (!stopReason) {
              await delay(6500);
              try {
                const response = await fetch('https://www.swcombine.com/ws/v2.0/inventory/facilities/' + listed.uid + '/', {
                  method: 'GET', redirect: 'error', signal: AbortSignal.timeout(25_000),
                  headers: {Accept: 'application/json', Authorization: 'OAuth ' + accessToken},
                });
                if (response.status === 429) stopReason = 'SWC rate limit reached';
                if (!response.ok) throw Error('detail HTTP ' + response.status);
                const body = await response.json();
                const e = body.swcapi?.entity?.value ?? body.swcapi?.entity;
                if (e?.uid !== listed.uid || e.owner?.attributes?.uid !== listed.ownerUid ||
                    e.type?.attributes?.uid !== '4:36' || e.location?.system?.attributes?.uid !== systemUid) throw Error('detail identity mismatch');
                report.mines.push(classify(listed, e, allowlist));
                continue;
              } catch (error) {
                const reason = /^(detail HTTP \d{3}|detail identity mismatch)$/.test(error.message) ? error.message : 'detail request unavailable';
                report.mines.push({...listed, classification: 'manual-review', category: 'manual-review', detailsUnavailable: true, reasons: [reason]});
                continue;
              }
            }
            report.mines.push({...listed, classification: 'manual-review', category: 'manual-review', detailsUnavailable: true, reasons: [stopReason]});
          }
          report.observedTo = new Date().toISOString();
          report.allowlist = allowlist ?? [];
          report.complete = report.coverage.every(c => c.status === 'inventory-complete') && report.mines.every(m => !m.detailsUnavailable);
          const counts = Object.fromEntries(['candidate', 'excluded', 'manual-review'].map(c =>
            [c, report.mines.filter(m => m.classification === c).length]));
          const key = readFileSync('tools/planet-api/snapshot-analysis-public-key.pem');
          writeFileSync(join(process.env.RUNNER_TEMP, 'system-mine-audit.encrypted.json'),
            JSON.stringify(encrypt(Buffer.from(JSON.stringify(report)), key)), {mode: 0o600});
          const categories = Object.fromEntries(['depleted', 'do-not-restart', 'paused-no-mine-space', 'paused-with-space-candidate', 'already-running', 'other-excluded', 'manual-review'].map(category =>
            [category, report.mines.filter(m => m.category === category).length]));
          console.log(JSON.stringify({system, complete: report.complete, ...counts, categories}));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: system-mine-audit-encrypted
          path: ${{ runner.temp }}/system-mine-audit.encrypted.json
          retention-days: 7
          if-no-files-found: error
      - name: Remove temporary OAuth data
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/swc-mine-private"
