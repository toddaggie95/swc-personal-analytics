name: Dispatch merged hub validation once
on:
  push:
    branches:
      - fix/dynamic-production-hub-membership
    paths:
      - .github/workflows/dispatch-hub-validation-once.yml
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    if: github.repository == 'toddaggie95/swc-personal-analytics'
    steps:
      - name: Dispatch validated main revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "07a8df5e5a22bab4635e5bf61de92206b2d4d5af"
          gh workflow run swc-production-dry-run.yml --ref main -f export_source=api -f enable_has_writes=true -f force_republish=false -f trash_superseded_exports=false
