name: Inspect expanded access evidence (offline)
on:
  push:
    branches: [feature/planet-access-validation]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: github.event.head_commit.message == 'Inspect expanded access evidence (offline)'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: swc-api-shadow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download existing encrypted evidence without SWC access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/resealed"
          gh api repos/toddaggie95/swc-personal-analytics/actions/artifacts/14193396475/zip > "$RUNNER_TEMP/evidence.zip"
          python3 - <<'PY'
          import os, pathlib, zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          with zipfile.ZipFile(root/'evidence.zip') as z:
              assert all('/' not in n and n.endswith('.encrypted.json') for n in z.namelist())
              z.extractall(root/'source')
          PY
      - name: Re-encrypt for local analysis without logging payloads
        env:
          SWC_API_SNAPSHOT_PRIVATE_KEY: ${{ secrets.SWC_API_SNAPSHOT_PRIVATE_KEY }}
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync,readdirSync} from 'node:fs';
          import {join} from 'node:path';
          import {encrypt,decrypt} from './tools/api-parity/private-audit-envelope.mjs';
          const base=process.env.RUNNER_TEMP;
          const publicKey=readFileSync('tools/planet-api/inspection-public-key.pem');
          for(const name of readdirSync(join(base,'source'))){
            const bytes=decrypt(JSON.parse(readFileSync(join(base,'source',name),'utf8')),process.env.SWC_API_SNAPSHOT_PRIVATE_KEY);
            writeFileSync(join(base,'resealed',name),JSON.stringify(encrypt(bytes,publicKey)),{mode:0o600});
          }
          console.log('Existing evidence re-encrypted; no SWC requests or payload logging.');
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: planet-evidence-for-local-analysis
          path: ${{ runner.temp }}/resealed/*.encrypted.json
          retention-days: 1
          if-no-files-found: error
