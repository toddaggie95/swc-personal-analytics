name: Dispatch accepted overview validation once
on:
  push:
    branches:
      - fix/dynamic-production-hub-membership
    paths:
      - .github/workflows/dispatch-overview-validation-once.yml
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    if: github.repository == 'toddaggie95/swc-personal-analytics'
    steps:
      - name: Dispatch overview for verified upstream run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/actions/runs/45432598507" --jq .conclusion)" = "success"
          test "$(gh api "repos/$GH_REPO/actions/runs/45432598507" --jq .workflow_id)" = "394464894"
          gh workflow run production-overview-readonly.yml --ref main -f accepted_batch_run_id=45432598507 -f force_republish=false
